  spring:
    application:
      name: bookkeeper-api

    datasource:
      url: jdbc:postgresql://localhost:5432/bookkeeper_db
      username: postgres
      password: mysecretpassword
      driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true
      database-platform: org.hibernate.dialect.PostgreSQLDialect

